name: Check source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Run policy and unit tests
        run: make check

      - name: Check smoke-test sources
        run: |
          python3 -m py_compile \
            tools/install_smoke.py \
            tools/install_storage_smoke.py \
            tools/install_gui_smoke.py \
            tools/meldra_vm.py
          sh -n installer/meldra-install.sh init/crypt-root-init.sh
          git diff --check
