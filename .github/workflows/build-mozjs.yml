name: Build mozjs

# SpiderMonkey 140 is too heavy to build on the maintainer's machine, so CI builds it. Manual only:
# nothing here runs on push or pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mozjs:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      # Actions are pinned to full commit hashes (the tag in the comment is what was resolved).
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          # The Firefox source is 4 GB extracted and the object directory several more.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/meldra
          sudo chown "$USER" /mnt/meldra
          df -h / /mnt

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv pkg-config make
          # Pinned to the Rust of Firefox 140's era: a much newer rustc (1.99 failed here) changes how
          # static libraries export symbols, and the final libmozjs link then misses the Rust symbols.
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          echo "gcc:    $(gcc --version | head -1)"
          echo "rustc:  $(rustc --version)"
          echo "cargo:  $(cargo --version)"
          echo "python: $(python3 --version)"
          echo "glibc:  $(ldd --version | head -1)"

      - name: Install cbindgen
        run: |
          # Firefox 140 needs cbindgen >= 0.27. Pinned exactly; --locked uses the crate's own lockfile.
          cargo install cbindgen --version 0.29.4 --locked
          crate=$(find "$HOME/.cargo/registry/cache" -name 'cbindgen-0.29.4.crate' | head -1)
          echo "2ecb53484c9c167ba674026b656d8a27d7657a58e6066aa902bfb1a4aa00ae20  $crate" | sha256sum -c -
          cbindgen --version

      - name: Build mozjs and gcc-runtime
        env:
          MOZBUILD_STATE_PATH: /mnt/meldra/mozbuild-state
        run: |
          mkdir -p out logs
          set -o pipefail
          python3 tools/build_mozjs.py \
            --jobs "$(nproc)" \
            --work /mnt/meldra/work \
            --cache /mnt/meldra/downloads \
            --output "$GITHUB_WORKSPACE/out" 2>&1 | tee logs/build-mozjs.log

      - name: Audit the packages
        run: |
          python3 tools/audit_needed.py out/*.kiln
          for package in out/*.kiln; do
            echo "== $package"
            tar -tf "$package" | head -40
          done
          mkdir -p inspect
          tar -xf out/mozjs-*.kiln -C inspect
          library=$(find inspect -name 'libmozjs-*.so*' -type f | head -1)
          readelf -d "$library" | grep -E 'SONAME|NEEDED|RPATH|RUNPATH'
          sha256sum out/*.kiln | tee out/SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: meldra-mozjs
          path: |
            out/*.kiln
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mozjs-build-log
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
